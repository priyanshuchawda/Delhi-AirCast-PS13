[project]
name = "delhi-aircast-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyanshu Chawda", email = "hellopriyanshu4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.11.1",
    "joblib>=1.4.2",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "pytest>=8.3.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.6.0",
    "uvicorn[standard]>=0.34.0",
    "torch>=2.14.0",
    "xgboost>=3.4.1",
    "networkx>=3.6.1",
]

[project.scripts]
delhi-aircast-report = "delhi_aircast_report:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
