[project]
name = "delhi-aircast-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyanshu Chawda", email = "hellopriyanshu4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.6.0",
]

[project.scripts]
delhi-aircast-report = "delhi_aircast_report:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
